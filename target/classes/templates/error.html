<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error - College Placement Connect</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container text-center mt-2">
        <div class="card">
            <h1 style="color: #dc3545;">Something went wrong!</h1>
            <p class="mt-1" th:text="${error != null ? error : 'An unexpected error occurred.'}"></p>
            <a href="/" class="btn mt-1">Go to Home</a>
        </div>
    </div>
</body>
</html>
