<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - College Placement Connect</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container" style="max-width: 500px; margin-top: 3rem;">
        <div class="card">
            <h2 class="text-center mb-1">Student Registration</h2>
            
            <div th:if="${param.success}" class="alert alert-success">
                Registration successful! <a th:href="@{/login}">Login here</a>
            </div>
            
            <div th:if="${errorMessage != null}" class="alert alert-error" th:text="${errorMessage}">
            </div>

            <form th:action="@{/register}" method="post" th:object="${user}">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" th:field="*{name}" class="form-control" required>
                    <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color: red;"></p>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" th:field="*{email}" class="form-control" required>
                    <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color: red;"></p>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" th:field="*{password}" class="form-control" required minlength="6">
                    <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color: red;"></p>
                </div>
                
                <button type="submit" class="btn" style="width: 100%;">Register</button>
            </form>
            
            <p class="text-center mt-1">
                Already registered? <a th:href="@{/login}">Login here</a>
            </p>
        </div>
    </div>
</body>
</html>
