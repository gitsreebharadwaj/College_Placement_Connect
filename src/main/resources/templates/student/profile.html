<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Profile - CPC</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    
    <div class="container">
        <div class="card">
            <h2>My Profile</h2>
            
            <div th:if="${success}" class="alert alert-success mt-1" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-error mt-1" th:text="${error}"></div>
            
            <form th:action="@{/student/profile}" method="post" th:object="${student}" class="mt-1">
                <div class="form-group">
                    <label>Email (Read-only)</label>
                    <input type="text" class="form-control" th:value="${student.user.email}" readonly style="background: #f4f4f4;">
                </div>
                
                <div class="form-group">
                    <label for="branch">Branch</label>
                    <input type="text" id="branch" th:field="*{branch}" class="form-control" required placeholder="e.g., Computer Science">
                </div>
                
                <div class="form-group">
                    <label for="graduationYear">Graduation Year</label>
                    <input type="number" id="graduationYear" th:field="*{graduationYear}" class="form-control" required min="2000" max="2100">
                </div>
                
                <div class="form-group">
                    <label for="cgpa">CGPA (0-10)</label>
                    <input type="number" step="0.01" id="cgpa" th:field="*{cgpa}" class="form-control" required min="0" max="10">
                </div>
                
                <div class="form-group">
                    <label for="backlogs">Active Backlogs</label>
                    <input type="number" id="backlogs" th:field="*{backlogs}" class="form-control" required min="0">
                </div>
                
                <div class="form-group">
                    <label for="skills">Skills (Comma separated)</label>
                    <input type="text" id="skills" th:field="*{skills}" class="form-control" placeholder="Java, SQL, HTML">
                </div>
                
                <button type="submit" class="btn">Update Profile</button>
            </form>
        </div>
    </div>
</body>
</html>
